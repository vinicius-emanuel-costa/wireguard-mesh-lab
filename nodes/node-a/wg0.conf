# =============================================
#  NODE-A — Config WireGuard (wg0)
#  IP na mesh: 10.10.0.1
#  Porta: 51820
# =============================================
#
# Run ./generate-keys.sh to generate real keys

# [Interface] = "quem sou eu"
[Interface]
# Minha chave privada (só eu tenho)
PrivateKey = NODE_A_PRIVATE_KEY
# Meu endereço na mesh
Address = 10.10.0.1/24
# Porta UDP que eu escuto conexões
ListenPort = 51820

# --- PEERS (meus vizinhos) ---

# Node B — ficha de contato
[Peer]
PublicKey = NODE_B_PUBLIC_KEY
AllowedIPs = 10.10.0.2/32
Endpoint = node-b:51820
PersistentKeepalive = 25

# Node C — ficha de contato
[Peer]
PublicKey = NODE_C_PUBLIC_KEY
AllowedIPs = 10.10.0.3/32
Endpoint = node-c:51820
PersistentKeepalive = 25

# Node D — ficha de contato
[Peer]
PublicKey = NODE_D_PUBLIC_KEY
AllowedIPs = 10.10.0.4/32
Endpoint = node-d:51820
PersistentKeepalive = 25

# Node E — ficha de contato
[Peer]
PublicKey = NODE_E_PUBLIC_KEY
AllowedIPs = 10.10.0.5/32
Endpoint = node-e:51820
PersistentKeepalive = 25
